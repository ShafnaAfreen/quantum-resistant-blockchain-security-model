[package]
name = "pqc_rust_bench"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pqcrypto-mldsa = "0.1.0"
pqcrypto-falcon = "0.3"
pqcrypto-traits = "0.3"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
pqcrypto-mldsa = { path = "vendor/pqcrypto-mldsa" }
